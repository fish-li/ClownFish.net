##### ClownFish.LogConfig #####
[Logging]

; 是否启用日志写入功能，总开关
Enable=true

;异步写入的间隔时间，单位：毫秒
TimerPeriod=100

;性能日志的阀值参数，超过这个阀值将会记录到性能日志中，单位：毫秒
Performance_HttpExecute=1000
Performance_HandleMessage=2000

; 日志文件相关配置
File_RootPath=Logs
File_MaxLength=200KB
File_MaxCount=5


[Logging.Writers]
; 定义一些默认的写入器，格式： name = type-fullname
Xml=ClownFish.Log.Writers.XmlWriter, ClownFish.net
Json=ClownFish.Log.Writers.JsonWriter, ClownFish.net
Json2=ClownFish.Log.Writers.Json2Writer, ClownFish.net

http=ClownFish.Log.Writers.HttpJsonWriter, ClownFish.net
ES=ClownFish.Log.Writers.ElasticsearchWriter, ClownFish.net
Rabbit2=ClownFish.Log.Writers.RabbitHttpWriter, ClownFish.net

Mem=ClownFish.UnitTest.Log.Writers.MemoryWriter, ClownFish.UnitTest
Err=ClownFish.UnitTest.Log.Writers.ErrorWriter, ClownFish.UnitTest
NULL=ClownFish.Log.Writers.NullWriter, ClownFish.net
Txt=ClownFish.Log.Writers.TxtWriter, ClownFish.net


[Logging.DataTypes]
;定义支持的数据类型，并为每种数据类型配置使用哪种写入器，
;如果某个数据类型同时指定了多个写入器，将会以不同的持久化方式同时记录多次
ClownFish.Log.Logging.OprLog, ClownFish.net=Xml,Json,txt
ClownFish.Log.Logging.InvokeLog, ClownFish.net=Xml,Json,Json2,http,txt

### 注意：数据类型使用哪种写入器，必须定义，否则日志组件不知道该如何记录它们！
ClownFish.UnitTest.Log.Writers.XMessage, ClownFish.UnitTest=mem,NULL
ClownFish.UnitTest.Log.Writers.ErrorMessage, ClownFish.UnitTest=err,NULL




