
# ini 格式的配置文件，供 ClownFish 类库读取
# 规则说明：
# 1，配置文件由一个或多个节(section)组成，每个节以[section-name]的形式开始
# 2，节下面是一个或多个参数行，每行一个参数，格式为 name=value
# 3，参数行中 name 和 value 之间可以有任意数量的空格
# 4，参数行中 name 和 value 的内容不做任何转义处理
# 5，井号(#)和分号(;) 【仅在行首】表示注释行，在行中间不表示注释

